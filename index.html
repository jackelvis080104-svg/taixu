<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#182623">
  <title>太虚问道录 · 雷芽初生</title>
  <style>
:root{color-scheme:dark;--shell:#162421;--ground:#20302a;--dark:#24342d;--line:#435046;--text:#eee8d8;--muted:#c3c5b3;--gold:#d4bd8d;--paper:#eeeadb;--ink:#252b24;--soft:#51594a;--green:#335648;--warn:#97492d}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#34453a 0,#1e2b26 52%,#192620 100%);color:var(--text);font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.6;font-size:1rem;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.49}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a06937;outline-offset:3px}
[hidden]{display:none!important}
h1,h2,p{margin:0}
.mast{background:var(--shell);border-bottom:1px solid #566052}
.mast-inner{max-width:1440px;padding:1.25rem clamp(1rem,3vw,2.8rem);display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:auto}
.brand{display:flex;gap:.85rem;align-items:center}
.seal{display:grid;place-items:center;background:#824f35;color:#fff0da;width:2.9rem;height:2.9rem;border:1px solid #d4a57b;border-radius:3px;box-shadow:inset 0 0 0 3px #824f35,inset 0 0 0 4px #d4a57b;font-family:serif;font-size:.88rem;white-space:nowrap}
h1,h2,.player-name{font-family:"Songti SC","Noto Serif CJK SC",SimSun,serif}
h1{font-size:clamp(1.38rem,3vw,1.9rem);font-weight:600;letter-spacing:.09em;line-height:1.2}
.subtitle{font-size:.82rem;color:var(--gold);letter-spacing:.16em}
.mast-status{display:grid;text-align:right;min-width:max-content;font-size:.9rem;color:var(--text)}
#sync{font-size:.82rem;color:var(--gold)}
.layout{display:grid;grid-template-columns:minmax(190px,.8fr) minmax(390px,2.05fr) minmax(225px,1fr);align-items:start;gap:1.1rem;max-width:1440px;margin:auto;padding:1.4rem clamp(1rem,3vw,2.8rem) 3rem}
.left,.center,.right{display:grid;gap:1.1rem;min-width:0}
.panel{border:1px solid;border-radius:9px;padding:clamp(.95rem,2vw,1.5rem);box-shadow:0 8px 25px #10201c24}
.dark{background:var(--dark);border-color:var(--line)}
.paper{background:var(--paper);border-color:#c8c0aa;color:var(--ink);color-scheme:light}
.paper .muted{color:var(--soft)}
.muted{color:var(--muted)}
.panel h2{font-size:1.14rem;font-weight:650;letter-spacing:.04em}
.dark h2{color:var(--gold)}
.player-name{font-size:1.48rem;margin-top:.55rem}
#rank{font-size:.91rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:.48rem;margin:.9rem 0}
.stat{background:#1c2b26;border:1px solid var(--line);border-radius:5px;padding:.46rem .6rem;font-size:.87rem;display:flex;align-items:baseline;justify-content:space-between;gap:.35rem}
.stat strong,.meter span:last-child{color:#efdbc0;font-variant-numeric:tabular-nums}
.meter{font-size:.89rem}.meter div{display:flex;justify-content:space-between}
progress{width:100%;height:.6rem;display:block;margin-top:.35rem;appearance:none;border:0;border-radius:8px;background:#15231e;overflow:hidden}
progress::-webkit-progress-bar{background:#15231e}
progress::-webkit-progress-value{background:#9eba94}
progress::-moz-progress-bar{background:#9eba94}
.map{display:grid;gap:.5rem;margin-top:.75rem}
.map button,.map .current{min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:.3rem;padding:.4rem .55rem;border:1px solid var(--line);border-radius:5px;color:var(--text);background:#1d2b25;text-align:left}
.map .current{background:#394c3d;border-color:#80947d}
.map small{font-size:.8rem;color:#d6d6bd}
.map button:not(:disabled):hover{border-color:#9fbb9f}
.scene-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem}
.place-mark{display:grid;place-items:center;flex:none;width:3rem;height:3rem;border-radius:7px;background:#dde0d1;border:1px solid #bbc2ac;color:#325147;font-family:serif;font-size:1.4rem}
.scene-head .kicker{font-size:.83rem;color:#56624e;font-weight:600}
.scene-head h2{font-size:1.85rem;line-height:1.2}
#scene{max-width:55ch}
.nearby{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem}
.nearby span{font-size:.88rem;background:#e2decc;color:#45483c;border-radius:4px;padding:.2rem .5rem}
.actions{display:flex;gap:.48rem;flex-wrap:wrap;margin-top:1.2rem;padding-top:.9rem;border-top:1px solid #c9c3af}
.button{border:1px solid #a7aa97;border-radius:5px;background:#f9f5e7;color:#26352b;padding:.5rem .85rem;min-height:44px;font-size:.93rem;font-weight:600}
.button:not(:disabled):hover{border-color:#48633e;background:#e0e7d6}
.button.primary{background:var(--green);color:#fff8e7;border-color:var(--green)}
.button.primary:not(:disabled):hover{background:#244837;color:white}
.notice,.reply{padding:.7rem .8rem;margin-top:1rem;border-left:3px solid #66806a;background:#e1e6d8;overflow-wrap:anywhere}
.notice.error{border-color:var(--warn);background:#f3e0ce}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem}
.tag{color:#43594b;font-size:.84rem;white-space:nowrap;background:#dbe3d2;border-radius:4px;padding:.1rem .45rem}
.fields{display:grid;grid-template-columns:minmax(110px,.62fr) minmax(0,2fr);gap:.65rem;margin:.8rem 0 .65rem}
.fields label{font-size:.88rem;font-weight:600;color:#424a3d}
select,input{width:100%;min-height:44px;margin-top:.28rem;padding:.42rem .55rem;border:1px solid #9b9c8b;border-radius:5px;background:#fffaf0;color:#242d24}
input::placeholder{color:#626455}
.compact{font-size:.86rem;margin-top:.6rem}
#accept,#retry{margin-top:.7rem}
.pack{display:grid;gap:.4rem;margin-top:.7rem;font-size:.93rem}
.pack div{display:flex;justify-content:space-between;gap:.55rem}
.deal{margin-top:.75rem;padding-top:.7rem;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
.journal ol{padding:0;list-style:none;margin:.65rem 0 0}
.journal li{padding:.62rem 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.journal li:last-child{border-bottom:0;padding-bottom:0}
.journal time{color:var(--gold);font-size:.82rem}
.journal strong{display:block;font-size:.95rem}
.journal p{color:var(--muted);font-size:.88rem}
.text-button{color:var(--text);background:none;border:0;padding:.35rem 0;min-height:44px;font-size:.87rem;text-decoration:underline;text-underline-offset:.16em}
@media(max-width:1080px){.layout{grid-template-columns:minmax(165px,.62fr) minmax(330px,1.65fr)}.right{grid-column:1/-1;grid-template-columns:1fr 1.4fr}}
@media(max-width:650px){.layout{display:flex;flex-direction:column;gap:.85rem;padding:.9rem .75rem 2rem}.left,.center,.right{width:100%;gap:.85rem}.left{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.right{grid-template-columns:1fr}.left .panel{padding:.7rem}.player-name{font-size:1.2rem}.map button,.map .current{font-size:.89rem}.stats{grid-template-columns:1fr;gap:.22rem;margin:.45rem 0}.stat{padding:.13rem .45rem}.mast-inner{padding:.85rem .75rem}.mast-status{font-size:.83rem}.paper .fields{grid-template-columns:1fr}.scene-head h2{font-size:1.6rem}.actions .button{flex:0 1 auto}}

.model-settings{margin-top:1.15rem;padding-top:.84rem;border-top:1px solid #c9c3af}
.model-settings summary{width:fit-content;color:#345347;font-size:.9rem;font-weight:650;cursor:pointer}
.model-settings label{display:block;margin-top:.7rem;font-size:.9rem;font-weight:650}
.model-settings button{margin-top:.5rem}

.deadline-warning{margin-top:.75rem;font-size:.9rem;color:#704220}

.compact-link{min-height:28px;padding:0;font-size:.78rem;color:var(--gold);text-align:right}
@media(max-width:650px){
  body{padding-bottom:env(safe-area-inset-bottom)}
  select,input{font-size:16px}
}

  </style>
</head>
<body>
  <header class="mast">
    <div class="mast-inner">
      <div class="brand"><span class="seal" aria-hidden="true">太虚</span><div><h1>太虚问道录</h1><span class="subtitle">雷芽初生</span></div></div>
      <div class="mast-status">
        <span id="clock">正在读档</span>
        <span id="sync" role="status">连接中</span>
        <button id="transfer-save" class="text-button compact-link" type="button" hidden>跨端引符</button>
      </div>
    </div>
  </header>
  <main class="layout" id="game">
    <aside class="left">
      <section class="dark panel" aria-labelledby="profile">
        <h2 id="profile">人物</h2>
        <p class="player-name">无名散修</p><p id="rank" class="muted">练气初期</p>
        <div id="resources" class="stats"></div>
        <div class="meter"><div><span>修为</span><span id="xp-label">—</span></div><progress id="xp" max="100" value="0" aria-label="修为"></progress></div>
      </section>
      <nav class="dark panel" aria-labelledby="map-title">
        <h2 id="map-title">去处</h2><div id="map" class="map"></div>
      </nav>
    </aside>

    <div class="center">
      <section class="scene paper panel" aria-labelledby="place">
        <div class="scene-head"><span id="place-mark" class="place-mark" aria-hidden="true">坊</span><div><span class="kicker" id="weather">青石地界</span><h2 id="place">青石坊</h2></div></div>
        <p id="scene">正在读取上次离开时的坊市。</p>
        <div id="nearby" class="nearby"></div>
        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <p id="deadline-warning" class="deadline-warning" hidden></p>
        <div id="actions" class="actions"></div>
        <button id="retry" class="button" type="button" hidden>核对并重试上次提交</button>
      </section>

      <section class="paper panel dialogue" aria-labelledby="dialogue-title">
        <div class="section-head"><h2 id="dialogue-title">交谈</h2><span id="mode" class="tag">本地对话</span></div>
        <form id="talk-form">
          <div class="fields">
            <label>交谈对象<select id="speaker" name="speaker"></select></label>
            <label>你想说什么<input id="message" name="message" maxlength="400" autocomplete="off" placeholder="想问价、托人采药，或者随便聊两句"></label>
          </div>
          <button id="send" type="submit" class="button primary">说话</button>
        </form>
        <p id="dialogue-tip" class="muted compact"></p>
        <div id="reply" class="reply" aria-live="polite" hidden></div>
        <button id="accept" class="button primary" type="button" hidden></button>
        <details id="model-settings" class="model-settings" hidden>
          <summary>连接模型（推荐智谱 GLM）</summary>
          <p id="model-status" class="muted compact" role="status"></p>
          <form id="model-form" method="post" action="/api/model" autocomplete="off">
            <label for="model-provider">服务平台预设</label>
            <select id="model-provider" name="provider">
              <option value="zhipu">智谱国内 (open.bigmodel.cn)</option>
              <option value="zai">Z.ai 海外 (api.z.ai)</option>
              <option value="deepseek">DeepSeek (api.deepseek.com)</option>
              <option value="custom">自定义 OpenAI 兼容接口</option>
            </select>
            <label for="model-name">模型名称（可自由填写任意模型 ID）</label>
            <input id="model-name" name="modelName" type="text" maxlength="128" autocomplete="off" spellcheck="false" value="glm-5.3-flash" placeholder="例如 glm-5.3-flash、glm-4-flash、deepseek-chat" required>
            <label for="model-key">API Key</label>
            <input id="model-key" name="key" type="password" maxlength="256" autocomplete="off" spellcheck="false" placeholder="粘贴对应开放平台的 API Key" required>
            <label for="model-base-url" id="model-base-label">接口 Base URL（选预设会自动填入）</label>
            <input id="model-base-url" name="baseUrl" type="url" maxlength="256" autocomplete="off" spellcheck="false" value="https://open.bigmodel.cn/api/paas/v4" placeholder="例如 https://open.bigmodel.cn/api/paas/v4" required>
            <label for="model-proxy">跨域中转网址（连智谱必填，直连留空）</label>
            <input id="model-proxy" name="proxy" type="url" maxlength="256" autocomplete="off" spellcheck="false" placeholder="例如 https://glm-proxy.xxx.workers.dev">
            <p id="model-provider-note" class="muted compact">切换平台预设会自动填充默认模型和接口地址，你也可以直接修改成任意模型名称。</p>
            <button id="connect-model" class="button" type="submit">验证并连接</button>
          </form>
          <button id="disconnect-model" class="button" type="button" hidden>断开模型</button>
          <p class="muted compact">连接有效期为 12 小时。仅自由对话消耗对应平台的 API 额度，按钮操作和闭关零消耗。</p>
        </details>
      </section>
    </div>

    <aside class="right">
      <section class="dark panel" aria-labelledby="pack-title">
        <h2 id="pack-title">行囊与产业</h2><div id="pack" class="pack"></div><div id="deal" class="deal"></div>
      </section>
      <section class="dark panel journal" aria-labelledby="journal-title">
        <div class="section-head"><h2 id="journal-title">坊市纪事</h2><button id="show-more" class="text-button" type="button" hidden>展开纪事</button></div>
        <ol id="journal"></ol>
      </section>
    </aside>
    <noscript>请开启 JavaScript 后进入游戏。</noscript>
  </main>

<script type="module">

const providers = {
  zhipu: { label: '智谱国内', baseUrl: 'https://open.bigmodel.cn/api/paas/v4', defaultModel: 'glm-5.3-flash', kind: 'zhipu' },
  zai: { label: 'Z.ai 海外', baseUrl: 'https://api.z.ai/api/paas/v4', defaultModel: 'glm-5.3-flash', kind: 'zai' },
  deepseek: { label: 'DeepSeek', baseUrl: 'https://api.deepseek.com', defaultModel: 'deepseek-chat', kind: 'deepseek' },
  custom: { label: '自定义接口', baseUrl: '', defaultModel: '', kind: 'custom' },
};

const places = {
  market: { name: '青石坊', mark: '坊', about: '摊主把丹瓶摆得靠里。梁掌柜贴了一张收药告示，旁边有人在问后山的雨。', links: ['field', 'valley'] },
  field: { name: '半山灵田', mark: '田', about: '旧田埂底下还有一层黑土。周阿禾说，这地种寻常药不显眼，种怕积水的药却正合适。', links: ['market', 'valley'] },
  valley: { name: '沉雷谷', mark: '谷', about: '谷口有一株被雷劈开的松树。石缝里的药要等第一场春雷，谷里的灰牙獾也会循着药味来。', links: ['market', 'field'] },
};
const people = {
  qiao: { name: '乔七', role: '散修', personality: '惜钱，话直，重视提前说定的价', goal: '采到雷芽草，攒够修伞的灵石' },
  liang: { name: '梁青', role: '药铺掌柜', personality: '耐心，精于算账', goal: '维持药铺的供货和库存' },
  he: { name: '周阿禾', role: '灵农', personality: '实在，不轻易夸人', goal: '租出灵田并保住田里的种源' },
  shen: { name: '沈照', role: '山门学徒', personality: '话少，急着练成第一重', goal: '采集山货换丹，争取突破' },
};
const items = { herb: '雷芽草', pill: '引气丹' };
const remedies = { buy: { herb: 8, pill: 8 }, sell: { herb: 6 } };
const stamp = tick => '第' + (Math.floor(tick / 2) + 1) + '日 · ' + (tick % 2 ? '申时' : '卯时');
const dayOf = tick => Math.floor(tick / 2) + 1;

function newGame() {
  const game = {
    tick: 0, player: { place: 'market', name: '无名散修', stones: 8, hp: 24, mp: 12, cultivation: 55, rank: 0, herb: 0, pill: 0, workedOn: 0 },
    npcs: { qiao: { place: 'market', stones: 1, herb: 0, rank: 0 }, liang: { place: 'market', stones: 40, herb: 0, pill: 2 }, he: { place: 'field', stones: 4, herb: 0 }, shen: { place: 'valley', stones: 2, rank: 0 } },
    patch: { sprouted: false, stock: 0, guarded: false }, field: { leased: false, planted: null, harvests: 0 },
    fight: null, contract: null, sales: 0, notes: [], history: [],
  };
  record(game, '春雷将至', '听说三天后有雷雨。乔七准备进谷，梁青正在收雷芽草。', 'world');
  return game;
}

function record(g, title, text, kind = 'player') {
  g.history.unshift({ tick: g.tick, title, text, kind });
  g.history.length = Math.min(g.history.length, 100);
}
function finishContract(g, kind, text) {
  const deal = g.contract;
  deal.status = kind;
  const titles = { ready: '乔七已备货', paid: '委托已交付', expired: '委托失效', failed: '乔七空手回坊' };
  record(g, titles[kind], text, 'deal');
}
function tickWorld(g) {
  const { qiao, liang, he, shen } = g.npcs;
  if (g.tick === 3) {
    qiao.place = 'valley';
    record(g, '乔七上山', '乔七带了药铲进沉雷谷，打算等春雷。', 'world');
  }
  if (g.tick === 4) {
    he.stones += 2;
    record(g, '周阿禾卖出秧苗', '周阿禾给下山的药贩送了两捆秧苗，换了两枚灵石。', 'world');
  }
  if (g.tick === 6) {
    Object.assign(g.patch, { sprouted: true, stock: 2, guarded: true });
    record(g, '沉雷谷下雨', '雷芽草已发芽，共两株。灰牙獾在药旁徘徊。', 'world');
  }
  if (g.tick === 7 && g.patch.stock > 0) {
    g.patch.stock -= 1;
    qiao.herb += 1;
    record(g, '乔七采到一株', '乔七趁灰牙獾离开水边，挖走一株活的雷芽草。', 'world');
  }
  if (g.tick === 8) {
    qiao.place = 'market';
    if (g.contract?.status === 'pending') {
      if (qiao.herb > 0) finishContract(g, 'ready', '乔七拿活草回了坊市。交货期限前，可以到坊市领药付款。');
      else finishContract(g, 'failed', '乔七进谷时已经没药可采，空手回了坊市。这单没成，你没有付款。');
    } else if (qiao.herb > 0) {
      qiao.herb -= 1; liang.herb += 1; qiao.stones += 6; liang.stones -= 6;
      record(g, '坊市进货', '乔七把雷芽草以六枚灵石卖给梁青，药铺已有现货。', 'world');
    }
  }
  if (g.tick === 10) {
    shen.place = 'market'; shen.stones += 8;
    record(g, '沈照回坊', '沈照把打来的山货交给了守山人，领到八枚灵石。', 'world');
  }
  if (g.tick === 12 && shen.stones >= 8 && liang.pill > 0) {
    shen.stones -= 8; liang.stones += 8; liang.pill -= 1; shen.rank = 1;
    record(g, '沈照突破', '沈照买走一枚引气丹，练到炼气中期。药铺少了一枚丹。', 'world');
  }
  if (g.contract && ['pending', 'ready'].includes(g.contract.status) && dayOf(g.tick) > g.contract.deadline) {
    if (g.contract.status === 'ready' && qiao.herb > 0 && liang.stones >= 6) {
      qiao.herb -= 1; liang.herb += 1; qiao.stones += 6; liang.stones -= 6;
      finishContract(g, 'expired', '约定期限到了。乔七把预留的雷芽草卖给药铺，你没有付款。');
    } else finishContract(g, 'expired', '约定期限到了，委托结清，你没有付款。');
  }
  if (g.field.planted?.ready === g.tick) {
    record(g, '雷芽草成熟', '种下的活草已经结籽。在灵田可以采收三株。', 'world');
  }
  if (g.tick > 12 && g.tick % 14 === 0) {
    shen.stones += 2;
    if (liang.pill < 2 && liang.stones >= 3) {
      liang.stones -= 3; liang.pill += 1;
      record(g, '铺里补丹', '梁青从来往商队进了一枚引气丹。', 'world');
    }
  }
}
function advance(g, slots) {
  for (let i = 0; i < slots; i += 1) {
    g.tick += 1;
    tickWorld(g);
  }
}
class RuleError extends Error {}
const requireRule = (ok, message) => { if (!ok) throw new RuleError(message); };
const whole = (value, min, max) => Number.isInteger(value) && value >= min && value <= max;
const at = (g, place, message) => requireRule(g.player.place === place, message);
const isNearby = (g, id) => Object.hasOwn(g.npcs, id) && g.npcs[id].place === g.player.place;
function npcLine(g, id) {
  if (id === 'qiao') {
    const d = g.contract;
    if (d?.status === 'ready') return '草带回来了，还带着根。' + d.price + '枚灵石，按说好的来。';

  if (parts.length !== 2 || parts.some(x => x.length > 1)) return NaN;
  const ten = parts[0] ? digits.indexOf(parts[0]) : 1;
  return 10 * ten + (parts[1] ? digits.indexOf(parts[1]) : 0);

function normalizeProxy(raw) {

  } catch {

  } catch (err) {
    if (err instanceof Error && err.message && !err.message.includes('fetch') && !err.message.includes('Load failed') && !err.message.includes('NetworkError')) throw err;
    throw new Error('被浏览器跨域拦截，无法直连 ' + modelName + '。请在下方填入 Cloudflare 跨域中转网址后再试。');
  }
}

async function localFetchData(path, body) {
  if (path === '/api/world') {
    return buildWorldPayload();
  }
  if (path === '/api/model') {
    if (body?.disconnect) {
      localStorage.removeItem(MODEL_KEY);
      return { connected: false };
    }
    return await verifyDirectModel(body?.provider, body?.modelName, body?.key, body?.baseUrl, body?.proxy);
  }
  if (path === '/api/action') {
    const state = loadSavedState();
    if (body.revision !== state.revision) {
      const err = new Error('存档已更新，请核对当前状态后再行动。');
      err.status = 409;
      err.body = buildWorldPayload();
      throw err;
    }
    try {
      const result = act(state.game, body.action);
      state.revision += 1;
      saveState(state);
      return { ...buildWorldPayload(), result };
    } catch (e) {
      const err = new Error(e.message || '无法执行此行动。');
      err.status = 422;
      throw err;
    }
  }
  if (path === '/api/dialogue') {
    const state = loadSavedState();
    const { npc, message, revision } = body;
    if (revision !== state.revision) {
      const err = new Error('存档已更新，请核对场景后再问。');
      err.status = 409;
      err.body = buildWorldPayload();
      throw err;
    }
    if (state.game.fight || state.game.npcs[npc]?.place !== state.game.player.place) {
      throw new Error('现在无法和这人交谈。');
    }
    const env = currentEnv();
    const { action: suggestion, ...answer } = await getSuggestion(state.game, npc, message, env);
    if (suggestion?.type === 'offer') {
      return { ...answer, action: suggestion, revision: state.revision };
    }
    recordConversation(state.game, npc, message, answer.line);
    state.revision += 1;
    saveState(state);
    return { ...answer, ...buildWorldPayload() };
  }
  if (path === '/api/transfer') {
    if (body === undefined) {
      const raw = localStorage.getItem(SAVE_KEY) || '';
      const bytes = new TextEncoder().encode(raw);
      const token = btoa(String.fromCharCode(...bytes));
      return { token };
    } else {
      try {
        const bin = atob(body.token.trim());
        const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
        const decoded = JSON.parse(new TextDecoder().decode(bytes));
        if (!decoded || typeof decoded.revision !== 'number' || !decoded.game?.player) {
          throw new Error('存档码格式无效。');
        }
        saveState(decoded);
        return buildWorldPayload();
      } catch {
        throw new Error('存档码无效或已损坏，请检查是否复制完整。');
      }
    }
  }
  throw new Error('未知指令');
}

const node = id => document.getElementById(id);
const format = tick => '第' + (Math.floor(tick / 2) + 1) + '日 · ' + (tick % 2 ? '申时' : '卯时');
const fields = { herb: '雷芽草', pill: '引气丹' };
const modelLabels = {};
const contractLabels = { pending: '待采药', ready: '可领取', paid: '已交付', failed: '未采到药', expired: '已失效' };
let data, pending = false, inDoubt = null, proposal = null, expanded = false, connecting = false;

function el(name, text, attrs = {}) {
  const value = document.createElement(name);
  value.textContent = text;
  Object.assign(value, attrs);
  return value;
}
function row(label, value) {
  const item = el('div', '');
  item.append(el('span', label), el('strong', String(value)));
  return item;
}
function button(label, action, options = {}) {
  const b = el('button', label, { type: 'button', className: options.className ?? 'button', disabled: Boolean(options.disabled || pending || inDoubt) });
  b.addEventListener('click', () => sendAction(action));
  return b;
}
function notice(text, error = false) {
  node('notice').hidden = !text;
  node('notice').textContent = text ?? '';
  node('notice').classList.toggle('error', error);
}
function reply(text) {
  node('reply').hidden = !text;
  node('reply').textContent = text ?? '';
}
function refreshView(body) {
  if (body?.game) data = { ...data, ...body };
}
const fetchData = localFetchData;
function draw() {
  if (!data?.game) return;
  const { game: g, places, people } = data;
  const p = g.player, spot = places[p.place];
  node('clock').textContent = format(g.tick);
  node('sync').textContent = pending ? '处理中' : inDoubt ? '待核对提交' : '存档已同步';
  node('rank').textContent = ['练气初期', '练气中期'][p.rank];
  const vital = [row('灵石', p.stones), row('气血', p.hp + '/24'), row('灵力', p.mp + '/12')];
  vital.forEach(x => x.className = 'stat');
  node('resources').replaceChildren(...vital);
  node('xp').value = p.cultivation;
  node('xp-label').textContent = p.cultivation + '%';

  node('map').replaceChildren(...Object.entries(places).map(([id, place]) => {
    const current = id === p.place;
    const entry = current ? el('div', '', { className: 'current' }) : button('', { type: 'move', to: id }, { disabled: Boolean(g.fight) });
    entry.append(el('span', place.name), el('small', current ? '所在' : '半日'));
    if (current) entry.setAttribute('aria-current', 'location');
    return entry;
  }));
  node('place').textContent = spot.name;
  node('place-mark').textContent = spot.mark;
  node('weather').textContent = g.patch.sprouted ? '春雷已至' : '春雷未至 · 第四日降雨';
  node('scene').textContent = g.fight ? '灰牙獾还剩 ' + g.fight.hp + ' 点气血。' + (g.fight.poised ? '它伏低身子准备猛扑，侧闪时能借势反击。' : '它收身试探，防住就有还手的机会。') : spot.about;
  const nearby = Object.entries(g.npcs).filter(([, person]) => person.place === p.place).map(([id]) => id);
  node('nearby').replaceChildren(...nearby.map(id => el('span', people[id].name + ' · ' + people[id].role)));
  node('actions').replaceChildren(...listActions(g));
  node('pack').replaceChildren(
    ...Object.entries(fields).map(([id, name]) => row(name, p[id])),
    row('灵田', g.field.leased ? '半亩' : '未租'),
    row('田中药草', g.field.planted ? (g.tick >= g.field.planted.ready ? '可以采收' : format(g.field.planted.ready) + '成熟') : '无'),
    row('收成 / 卖出', g.field.harvests + '茬 / ' + g.sales + '株'),
  );
  node('deal').textContent = describeContract(g);
  node('deadline-warning').hidden = true;
  if (g.contract && ['pending', 'ready'].includes(g.contract.status)) {
    const remaining = g.contract.deadline * 2 - g.tick;
    if (remaining > 0 && remaining <= 6) {
      const warning = node('deadline-warning');
      warning.textContent = '委托最晚第' + g.contract.deadline + '日申时领取。再过' + remaining + '个半日就会过期。';
      if (remaining === 2 && p.place !== 'market') warning.textContent += ' 现在还来得及赶回青石坊。';
      if (remaining === 1 && p.place === 'market' && g.contract.status === 'ready') warning.textContent += ' 可先领药，再行动。';
      warning.hidden = false;
    }
  }
  drawJournal();

  const speaker = node('speaker'), selection = speaker.value;
  speaker.replaceChildren(...nearby.map(id => el('option', people[id].name, { value: id })));
  if (nearby.includes(selection)) speaker.value = selection;
  if (!nearby.length) speaker.append(el('option', '此处无人', { value: '' }));
  speaker.disabled = pending || Boolean(inDoubt || g.fight || !nearby.length);
  node('message').disabled = speaker.disabled;
  node('send').disabled = speaker.disabled;
  node('mode').textContent = data.model?.active ? data.model.active : (data.ai ? '模型对话已配置' : '本地对话');
  if (node('transfer-save')) node('transfer-save').hidden = !data.anonymous;
  drawModel();
  node('dialogue-tip').textContent = data.ai ? '谈成的委托会列出价格和期限供你确认。' : '可以试着对乔七说「五枚灵石，帮我留一株活雷芽草，第五日来取」。';
  node('accept').hidden = !proposal;
  node('accept').disabled = pending || Boolean(inDoubt);
  if (proposal) node('accept').textContent = '确认委托 · ' + proposal.action.price + '枚 · 第' + proposal.action.deadline + '日截止';
  node('retry').hidden = !inDoubt;
  node('retry').disabled = pending;
}
function describeContract(g) {
  if (!g.contract) return '暂无委托。';
  const { status, price, deadline } = g.contract;
  const title = '乔七的委托 · ' + contractLabels[status] + '。';
  if (status === 'paid') return title + '已付' + price + '枚灵石。';
  if (status === 'failed' || status === 'expired') return title + '未付款。';
  return title + '最晚第' + deadline + '日申时领取，拿到药时付' + price + '枚。';
}

function drawModel() {
  const model = data?.model;
  node('model-settings').hidden = !model?.available;
  node('model-form').hidden = Boolean(model?.active);
  node('disconnect-model').hidden = !model?.active;
  node('connect-model').disabled = connecting;
  node('disconnect-model').disabled = connecting;
}
async function updateModel(body) {
  if (connecting) return;
  const status = node('model-status');
  connecting = true;
  status.textContent = body.disconnect ? '正在断开…' : '正在验证密钥…';
  drawModel();
  try {
    await fetchData('/api/model', body);
    const fresh = await fetchData('/api/world');
    if (fresh.revision >= data.revision) refreshView(fresh);
    else data = { ...data, ai: fresh.ai, model: fresh.model };
    status.textContent = body.disconnect
      ? fresh.model.active ? '未能断开，请再试一次。' : '已断开，存档可以继续玩。'
      : fresh.model.active === body.modelName
        ? '已连接 ' + body.modelName + '。现在可以和 NPC 自由对话。'
        : '浏览器没有保留连接。请在独立网页打开游戏后重试。';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    connecting = false;
    draw();
  }
}

function drawJournal() {
  const entries = data.game.history;
  node('journal').replaceChildren(...entries.slice(0, expanded ? 100 : 6).map(entry => {
    const li = el('li', '');
    li.append(el('time', format(entry.tick)), el('strong', entry.title), el('p', entry.text));
    return li;
  }));
  node('show-more').hidden = entries.length <= 6;
  node('show-more').textContent = expanded ? '收起纪事' : '展开纪事';
  node('show-more').setAttribute('aria-expanded', String(expanded));
}
function listActions(g) {
  const p = g.player, shop = g.npcs.liang;
  const actions = [];
  const add = (label, action, disabled = false, primary = false) => actions.push(button(label, action, { disabled, className: primary ? 'button primary' : 'button' }));
  if (g.fight) {
    for (const [move, label] of [['strike', p.mp >= 3 ? '运灵进攻 · 3灵力' : '普通进攻'], ['guard', '守势'], ['evade', '侧闪'], ['flee', '撤回坊市']]) add(label, { type: 'combat', move });
    return actions;
  }
  if (p.place === 'market') {
    if (g.contract?.status === 'ready') add('向乔七领药 · ' + g.contract.price + '灵石', { type: 'collect' }, p.stones < g.contract.price, true);
    add('接半日短工 · +3灵石', { type: 'work' }, p.workedOn === Math.floor(g.tick / 2) + 1, true);
    add('买引气丹 · 8灵石', { type: 'buy', item: 'pill' }, p.stones < 8 || shop.pill < 1);
    add('买雷芽草 · ' + (shop.herb ? '8灵石' : '缺货'), { type: 'buy', item: 'herb' }, p.stones < 8 || shop.herb < 1);
    add('卖雷芽草 · 6灵石', { type: 'sell', item: 'herb' }, !p.herb || shop.stones < 6);
  }
  if (p.place === 'field') {
    if (!g.field.leased) add('租半亩田 · 8灵石', { type: 'lease' }, p.stones < 8, true);
    else if (!g.field.planted) add('种下雷芽草 · 1株', { type: 'plant' }, !p.herb, true);
    else add('采收 · 3株', { type: 'harvest' }, g.tick < g.field.planted.ready, true);
  }
  if (p.place === 'valley') add(g.patch.stock ? (g.patch.guarded ? '清理药丛旁的灰牙獾' : '采雷芽草 · 还剩' + g.patch.stock + '株') : (g.patch.sprouted ? '这茬草已采完' : '等春雷后再采药'), { type: 'gather' }, !g.patch.stock, true);
  if (g.npcs.qiao.place === p.place && g.tick < 7 && (!g.contract || g.contract.status === 'expired')) add('请乔七留一株 · 第五日取 · 5灵石', { type: 'offer', price: 5, deadline: 5 }, p.stones < 5);
  add('静候半日', { type: 'wait' });
  if (p.place !== 'valley') {
    add('闭关一日', { type: 'retreat', slots: 2 });
    add('闭关三日', { type: 'retreat', slots: 6 });
    if (p.rank === 0) {
      if (p.pill) add('服引气丹突破', { type: 'breakthrough', item: 'pill' }, p.cultivation !== 100, true);
      if (p.herb) add('服雷芽草突破', { type: 'breakthrough', item: 'herb' }, p.cultivation !== 100, true);
    }
  }
  return actions;
}
function sendAction(action) {
  return submit('/api/action', { id: crypto.randomUUID(), revision: data.revision, action });
}
async function submit(path, input) {
  if (pending || (inDoubt && inDoubt.input.id !== input.id)) return;
  pending = true;
  proposal = null;
  reply('');
  draw();
  try {
    const body = await fetchData(path, input);
    refreshView(body);
    inDoubt = null;
    if (path === '/api/dialogue') {
      notice(body.reason ?? '');
      reply(data.people[input.npc].name + '说：“' + body.line + '”');
      if (body.action?.type === 'offer' && body.revision === data.revision) {
        proposal = { action: body.action, revision: body.revision };
      }
      node('message').value = '';
    } else notice(body.result);
  } catch (error) {
    refreshView(error.body);
    inDoubt = !error.status || error.status >= 500 ? { path, input } : null;
    notice(inDoubt ? '暂未确认是否已保存。可用下方按钮核对上次提交。' : error.message, true);
  } finally {
    pending = false;
    draw();
  }
}
node('retry').addEventListener('click', () => { if (inDoubt) submit(inDoubt.path, inDoubt.input); });
node('show-more').addEventListener('click', () => { expanded = !expanded; drawJournal(); });
node('accept').addEventListener('click', () => { if (proposal?.revision === data.revision) sendAction(proposal.action); });
node('model-provider').addEventListener('change', event => {
  const preset = providers[event.target.value];
  if (!preset) return;
  if (preset.defaultModel) node('model-name').value = preset.defaultModel;
  else node('model-name').value = '';
  if (preset.baseUrl) node('model-base-url').value = preset.baseUrl;
  else node('model-base-url').value = '';
});
const PROXY_CACHE_KEY = 'taixu_wendaolu_proxy_v1';
if (node('model-proxy')) {
  node('model-proxy').value = localStorage.getItem(PROXY_CACHE_KEY) || '';
}
node('model-form').addEventListener('submit', event => {
  event.preventDefault();
  if (connecting) return;
  const input = node('model-key');
  const modelInput = node('model-name');
  const baseInput = node('model-base-url');
  const proxyInput = node('model-proxy');
  const key = input.value;
  const modelName = modelInput ? modelInput.value.trim() : '';
  const baseUrl = baseInput ? baseInput.value.trim() : '';
  const proxy = proxyInput ? proxyInput.value.trim() : '';
  if (proxy) localStorage.setItem(PROXY_CACHE_KEY, proxy);
  input.value = '';
  if (key.trim() && modelName && baseUrl) {
    updateModel({ provider: node('model-provider').value, modelName, key, baseUrl, proxy });
  }
});
node('disconnect-model').addEventListener('click', () => updateModel({ disconnect: true }));
node('talk-form').addEventListener('submit', event => {
  event.preventDefault();
  if (pending || inDoubt) return;
  const npc = node('speaker').value, message = node('message').value.trim();
  if (npc && message) submit('/api/dialogue', { id: crypto.randomUUID(), npc, message, revision: data.revision });
});

if (node('transfer-save')) {
  node('transfer-save').addEventListener('click', async () => {
    try {
      const { token } = await fetchData('/api/transfer');
      const input = window.prompt(
        '【本地存档码】（复制保存可备份或发给其他设备导入；输入 RESET 可重开新档）：\n' + token + '\n\n如需导入其他设备的存档码，请清空后粘贴：',
        token
      );
      if (!input || input.trim() === token) return;
      if (input.trim().toUpperCase() === 'RESET') { localStorage.removeItem(SAVE_KEY); data = await fetchData('/api/world'); notice('已重置为新档！'); draw(); return; }
      const imported = await fetchData('/api/transfer', { token: input.trim() });
      refreshView(imported);
      notice('已成功导入跨端存档！');
      draw();
    } catch (error) {
      notice(error.message, true);
    }
  });
}

try {
  data = await fetchData('/api/world');
  draw();
} catch (error) {
  node('sync').textContent = '读档失败';
  notice(error.message, true);
}

</script>

</body>
