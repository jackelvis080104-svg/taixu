<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111615">
  <title>太虚修仙人生模拟器</title>
  <style>
:root{
  color-scheme:dark;
  --bg:#0d1211;
  --panel:#151d1b;
  --card:#1d2623;
  --soft:#25312d;
  --paper:#efe8d6;
  --paper-deep:#e3d9c1;
  --ink:#222721;
  --text:#f0eadb;
  --muted:#a6afa0;
  --gold:#dcb975;
  --gold-dim:#8f7443;
  --jade:#5ca388;
  --crimson:#c75b46;
  --pink:#d97b93;
  --line:#313e39;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:radial-gradient(circle at 50% 0%,#23302c 0%,#0f1413 70%,#090d0c 100%);
  color:var(--text);
  font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14.5px;
  line-height:1.55;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
h1,h2,h3,.serif{font-family:"Songti SC","Noto Serif CJK SC",SimSun,serif}
button,input,select{font:inherit}
button{cursor:pointer;border:none}
button:disabled{opacity:.42;cursor:default}
[hidden]{display:none!important}

.app{
  width:100%;
  max-width:580px;
  min-height:100vh;
  background:var(--panel);
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  box-shadow:0 0 45px rgba(0,0,0,.75);
}

/* 顶部状态栏 */
.top-bar{
  background:linear-gradient(180deg,#1e2825 0%,#141c1a 100%);
  border-bottom:1px solid var(--line);
  padding:.65rem .85rem .6rem;
  position:sticky;
  top:0;
  z-index:20;
}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.dao-info{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
.dao-info strong{font-size:1.05rem;color:#fff7e6;letter-spacing:.04em}
.badge{
  font-size:.73rem;padding:.1rem .44rem;border-radius:4px;
  background:rgba(220,185,117,.16);border:1px solid var(--gold-dim);
  color:var(--gold);font-weight:600;
}
.badge.jade{background:rgba(92,163,136,.16);border-color:#447864;color:#9ee0c6}
.sub-line{font-size:.75rem;color:var(--muted);margin-top:.12rem}

/* 五维属性条 */
.attr-grid{
  display:grid;grid-template-columns:repeat(6,1fr);gap:.3rem;
  margin-top:.5rem;
}
.attr-box{
  background:#101614;border:1px solid #2a3631;border-radius:5px;
  padding:.2rem .25rem;text-align:center;font-size:.72rem;
}
.attr-box span{display:block;color:var(--muted);font-size:.66rem}
.attr-box strong{color:#f2dfba;font-variant-numeric:tabular-nums}

/* 导航切换 */
.nav-tabs{
  display:grid;grid-template-columns:repeat(4,1fr);
  background:#111715;border-bottom:1px solid var(--line);
}
.nav-tab{
  background:none;color:var(--muted);padding:.48rem .2rem;
  font-size:.82rem;font-weight:600;border-bottom:2px solid transparent;
}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:rgba(220,185,117,.06)}

/* 主舞台 */
.stage{flex:1;padding:.8rem .85rem 1.4rem;display:flex;flex-direction:column;gap:.75rem}

/* 编年体人生长卷 */
.chronicle-wrap{
  flex:1;
  min-height:270px;
  max-height:46vh;
  overflow-y:auto;
  background:var(--paper);
  color:var(--ink);
  border:1px solid #c5bca4;
  border-radius:10px;
  padding:.75rem .85rem;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.12);
  display:flex;
  flex-direction:column;
  gap:.55rem;
}
.life-entry{
  padding-bottom:.5rem;
  border-bottom:1px dashed #c8bfa8;
  font-size:.9rem;
  line-height:1.58;
}
.life-entry:last-child{border-bottom:none;padding-bottom:0}
.life-age{
  display:inline-block;
  font-weight:700;
  font-size:.78rem;
  padding:.05rem .38rem;
  border-radius:4px;
  background:#334a40;
  color:#fff6e5;
  margin-right:.4rem;
}
.life-entry.major .life-age{background:#8c3b2b}
.life-entry.good .life-age{background:#8f6b29}
.life-entry.love .life-age{background:#8c3b58}
.life-delta{
  display:block;
  margin-top:.2rem;
  font-size:.78rem;
  font-weight:600;
  color:#385c4c;
}

/* 命运抉择卡（遇到事件时弹出替换普通行动栏） */
.choice-card{
  background:linear-gradient(180deg,#242d2a 0%,#19211f 100%);
  border:1px solid var(--gold);
  border-radius:10px;
  padding:.85rem;
  box-shadow:0 8px 24px rgba(0,0,0,.45);
}
.choice-card h3{margin:0 0 .35rem;font-size:1rem;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.choice-desc{font-size:.88rem;color:#f3ede0;margin:0 0 .65rem;line-height:1.55}
.choice-list{display:grid;gap:.45rem}
.choice-btn{
  width:100%;text-align:left;padding:.52rem .7rem;border-radius:7px;
  background:#131917;border:1px solid #3f4f49;color:var(--text);
  font-size:.85rem;line-height:1.4;transition:all .12s ease;
}
.choice-btn:hover:not(:disabled){border-color:var(--gold);background:#222e2a}
.choice-req{font-size:.74rem;color:var(--gold);font-weight:600;margin-right:.35rem}
.choice-req.fail{color:var(--crimson)}

/* 通用按钮与输入框 */
.btn{
  min-height:42px;padding:.45rem .75rem;border-radius:7px;
  background:var(--soft);border:1px solid #485952;color:var(--text);
  font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;
}
.btn:hover:not(:disabled){border-color:var(--gold);background:#2f3e39}
.btn.primary{background:linear-gradient(180deg,#3b6e5b 0%,#284f41 100%);border-color:#69a890;color:#fff9eb}
.btn.gold{background:linear-gradient(180deg,#9c7538 0%,#735322 100%);border-color:#e0c084;color:#fff9eb}
.btn.pink{background:linear-gradient(180deg,#8c4658 0%,#632e3c 100%);border-color:#d98a9e;color:#fff0f4}
.btn.danger{background:#5c2b22;border-color:#a85544;color:#ffeae5}
.btn.sm{min-height:32px;padding:.22rem .55rem;font-size:.78rem}

.inp{
  width:100%;min-height:38px;padding:.35rem .6rem;
  border:1px solid #45544e;border-radius:6px;
  background:#111715;color:var(--text);
}
.ink-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem}
.ink-card h3{margin:0 0 .5rem;font-size:.98rem;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.slot-box{
  background:#141b19;border:1px solid #2e3b36;border-radius:8px;
  padding:.55rem;display:flex;flex-direction:column;justify-content:space-between;gap:.35rem;
}
.slot-box strong{font-size:.88rem;color:#f5ebd6}
.slot-box small{font-size:.76rem;color:var(--muted);line-height:1.4}

/* 天赋与属性分配界面 */
.setup-box{
  background:var(--panel);padding:.9rem;display:flex;flex-direction:column;gap:.75rem;
}
.stat-row{
  display:flex;justify-content:space-between;align-items:center;
  background:#111715;border:1px solid #2c3833;border-radius:7px;padding:.4rem .65rem;
}
.stat-ctrl{display:flex;align-items:center;gap:.55rem}
.stat-ctrl button{
  width:28px;height:28px;border-radius:5px;background:var(--soft);
  color:var(--gold);font-weight:700;border:1px solid #485952;
}
.talent-item{
  background:#131917;border:1px solid #32403b;border-radius:7px;
  padding:.48rem .55rem;text-align:left;display:flex;flex-direction:column;gap:.18rem;
}
.talent-item.picked{border-color:var(--gold);background:#23352e;box-shadow:0 0 10px rgba(220,185,117,.2)}
.tier-tag{font-size:.68rem;padding:.04rem .3rem;border-radius:3px;width:fit-content;font-weight:700}
.t-red{background:#5e231c;color:#ffb4a8;border:1px solid #b84b3c}
.t-gold{background:#57421b;color:#ffe29e;border:1px solid #c99d49}
.t-blue{background:#1f3b4d;color:#a8dcff;border:1px solid #4885ad}
.t-gray{background:#2c3330;color:#c2c9c5;border:1px solid #525e59}

/* 结算弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(6,9,8,.88);
  display:flex;justify-content:center;align-items:center;padding:.85rem;z-index:50;
}
.modal-box{
  width:100%;max-width:500px;max-height:90vh;overflow-y:auto;
  background:var(--paper);color:var(--ink);border:2px solid var(--gold);
  border-radius:12px;padding:1.1rem;box-shadow:0 15px 45px rgba(0,0,0,.85);
}
.toast{padding:.5rem .7rem;border-radius:6px;font-size:.82rem;background:#1f332c;border-left:3px solid var(--jade);color:#e6f5ee}
.toast.warn{background:#3a221d;border-left-color:var(--crimson);color:#ffe6e0}
  </style>
</head>
<body>
<div class="app">
  <!-- 阶段一：轮回转世（抽天赋 + 分配五维属性） -->
  <div id="screen-setup" class="setup-box" hidden>
    <div style="text-align:center;border-bottom:1px solid var(--line);padding-bottom:.6rem">
      <h1 class="serif" style="margin:0;font-size:1.45rem;color:var(--gold)">太虚修仙人生模拟器</h1>
      <p style="margin:.2rem 0 0;font-size:.8rem;color:var(--muted)">第 <span id="reincarnation-num">1</span> 世轮回 · 抽取先天命格并分配属性</p>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem">
      <div>
        <label style="font-size:.76rem;color:var(--muted)">此世道号</label>
        <input id="setup-name" class="inp" value="林凡" maxlength="10">
      </div>
      <div>
        <label style="font-size:.76rem;color:var(--muted)">出身家世</label>
        <select id="setup-origin" class="inp">
          <option value="farm">山野猎户之子（体魄+2）</option>
          <option value="scholar">书香世家子弟（悟性+2）</option>
          <option value="merchant">修仙坊市商贾（灵石+40,魅力+1）</option>
          <option value="fallen">没落修仙家族（根骨+1,气运+1）</option>
        </select>
      </div>
    </div>

    <!-- 十连抽天赋 -->
    <div class="ink-card">
      <h3>
        <span>先天命格（已选 <span id="picked-count">0</span>/3）</span>
        <button type="button" class="btn sm gold" id="btn-draw-talents">重新十连抽</button>
      </h3>
      <div class="grid-2" id="draw-pool" style="max-height:33vh;overflow-y:auto"></div>
    </div>

    <!-- 20点属性自由分配 -->
    <div class="ink-card">
      <h3>
        <span>先天属性分配</span>
        <span style="font-size:.82rem;color:var(--jade)">剩余可用点数：<strong id="pts-left">20</strong></span>
      </h3>
      <div style="display:grid;gap:.38rem" id="stat-alloc-list"></div>
    </div>

    <button type="button" class="btn gold" id="btn-begin-life" style="min-height:46px;font-size:.98rem">凝聚道胎 · 开启此生仙途</button>
  </div>

  <!-- 阶段二：主游戏界面 -->
  <div id="screen-play" hidden style="display:flex;flex-direction:column;flex:1">
    <header class="top-bar">
      <div class="top-row">
        <div class="dao-info">
          <strong id="hud-name" class="serif">林凡</strong>
          <span class="badge" id="hud-realm">凡人</span>
          <span class="badge jade" id="hud-sect">散修</span>
        </div>
        <span style="font-size:.76rem;color:var(--gold)" id="hud-age">0 / 80 岁</span>
      </div>
      <div class="sub-line" id="hud-sub">修为进度：0% · 灵石：10 · 命格：无</div>
      <div class="attr-grid">
        <div class="attr-box"><span>根骨</span><strong id="v-bone">5</strong></div>
        <div class="attr-box"><span>悟性</span><strong id="v-int">5</strong></div>
        <div class="attr-box"><span>体魄</span><strong id="v-body">5</strong></div>
        <div class="attr-box"><span>气运</span><strong id="v-luck">5</strong></div>
        <div class="attr-box"><span>魅力</span><strong id="v-charm">5</strong></div>
        <div class="attr-box"><span>战力</span><strong id="v-power">10</strong></div>
      </div>
    </header>

    <nav class="nav-tabs">
      <button type="button" class="nav-tab active" data-view="life">人生轨迹</button>
      <button type="button" class="nav-tab" data-view="relations">道侣与因果</button>
      <button type="button" class="nav-tab" data-view="assets">神通与宝物</button>
      <button type="button" class="nav-tab" data-view="settings">天道模型</button>
    </nav>

    <main class="stage">
      <div id="toast" class="toast" hidden></div>

      <!-- 视图 1：编年体人生轨迹 + 命运抉择 -->
      <section id="view-life" style="display:flex;flex-direction:column;gap:.75rem;flex:1">
        <div class="chronicle-wrap" id="chronicle-box"></div>

        <!-- 遇到抉择事件时显示 -->
        <div id="choice-panel" class="choice-card" hidden>
          <h3><span id="choice-title">命运抉择</span><span style="font-size:.75rem;color:var(--muted)">审时度势</span></h3>
          <p class="choice-desc" id="choice-desc"></p>
          <div class="choice-list" id="choice-options"></div>

          <!-- AI 自由输入自主破局 -->
          <form id="ai-choice-form" style="margin-top:.65rem;padding-top:.6rem;border-top:1px dashed #3d4d47">
            <label style="font-size:.76rem;color:var(--gold);display:block;margin-bottom:.25rem">或自主输入破局之法（由天道大模型根据你的属性推演成败）：</label>
            <div style="display:flex;gap:.4rem">
              <input id="ai-choice-input" class="inp" maxlength="160" placeholder="例如：假意顺从，暗中催动护身符偷袭">
              <button type="submit" class="btn gold sm" id="btn-ai-choice" style="white-space:nowrap;min-height:38px">自主破局</button>
            </div>
          </form>
        </div>

        <!-- 平常年份推进控制栏 -->
        <div id="normal-controls" style="display:grid;gap:.5rem">
          <div class="grid-2">
            <button type="button" class="btn primary" id="btn-next-year" style="min-height:46px;font-size:.95rem">岁月流转（+1年）</button>
            <button type="button" class="btn" id="btn-skip-5">闭关潜修（+5年）</button>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem">
            <button type="button" class="btn sm" id="btn-act-explore">外出游历(5灵石)</button>
            <button type="button" class="btn sm" id="btn-act-auction">万宝楼拍卖会</button>
            <button type="button" class="btn sm gold" id="btn-act-break">冲关渡劫</button>
          </div>
        </div>
      </section>

      <!-- 视图 2：道侣、师门与仇敌因果 -->
      <section id="view-relations" hidden style="display:grid;gap:.7rem">
        <div class="ink-card">
          <h3><span>此世因果名录（道侣 · 恩师 · 宿敌）</span></h3>
          <div id="rel-list" style="display:grid;gap:.5rem"></div>
        </div>
      </section>

      <!-- 视图 3：功法神通与法宝储物 -->
      <section id="view-assets" hidden style="display:grid;gap:.7rem">
        <div class="ink-card">
          <h3><span>已悟功法与本命法宝</span></h3>
          <div id="asset-list" class="grid-2"></div>
        </div>
        <div class="ink-card">
          <h3><span>先天命格一览</span></h3>
          <div id="talent-summary" class="grid-2"></div>
        </div>
      </section>

      <!-- 视图 4：天道大模型设置（沿用你的 Key 与 Cloudflare 中转配置） -->
      <section id="view-settings" hidden style="display:grid;gap:.7rem">
        <div class="ink-card">
          <h3><span>天道神识 · 大模型连接</span><span id="conn-badge" style="font-size:.76rem;color:var(--jade)">未连接</span></h3>
          <p style="font-size:.78rem;color:var(--muted);margin:0 0 .55rem">连接后，遇到命运事件可输入任意自主破局手段，也可向道侣/仇敌自由传音互动。</p>
          <form id="model-form" style="display:grid;gap:.45rem">
            <select id="model-provider" class="inp">
              <option value="zhipu">智谱国内 (open.bigmodel.cn)</option>
              <option value="zai">Z.ai 海外 (api.z.ai)</option>
              <option value="deepseek">DeepSeek (api.deepseek.com)</option>
              <option value="custom">自定义 OpenAI 兼容接口</option>
            </select>
            <input id="model-name" class="inp" value="glm-5.3-flash" placeholder="模型名称，如 glm-5.3-flash" required>
            <input id="model-key" type="password" class="inp" placeholder="粘贴 API Key" required>
            <input id="model-base-url" type="url" class="inp" value="https://open.bigmodel.cn/api/paas/v4" required>
            <input id="model-proxy" type="url" class="inp" placeholder="跨域中转网址（连智谱必填，直连留空）">
            <div style="display:flex;gap:.45rem">
              <button type="submit" class="btn primary" id="btn-connect" style="flex:1">验证并连接</button>
              <button type="button" class="btn danger" id="btn-disconnect" hidden>断开</button>
            </div>
          </form>
        </div>

        <div class="ink-card">
          <h3><span>轮回与存档</span></h3>
          <div class="grid-2">
            <button type="button" class="btn" id="btn-export">导出存档码</button>
            <button type="button" class="btn" id="btn-import">导入存档码</button>
            <button type="button" class="btn danger" id="btn-force-rebirth" style="grid-column:1/-1">兵解转世（结束本世开启新轮回）</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- 阶段三：身死道消 / 飞升轮回结算弹窗 -->
<div id="ending-modal" class="modal-mask" hidden>
  <div class="modal-box">
    <h2 class="serif" id="end-title" style="margin:0 0 .3rem;color:#7a2e20">寿元耗尽 · 坐化仙逝</h2>
    <p id="end-summary" style="font-size:.9rem;line-height:1.6;margin:0 0 .7rem"></p>
    <div id="end-highlights" style="background:var(--paper-deep);padding:.65rem;border-radius:8px;font-size:.82rem;margin-bottom:.8rem"></div>
    <button type="button" class="btn gold" id="btn-next-reincarnation" style="width:100%;min-height:44px">携带天道感悟 · 再入轮回（下世属性点+2）</button>
  </div>
</div>

<script type="module">
const SAVE_KEY = 'taixu_life_sim_v1';
const META_KEY = 'taixu_life_meta_v1';
const MODEL_KEY = 'taixu_wendaolu_model_v1';
const PROXY_CACHE_KEY = 'taixu_wendaolu_proxy_v1';

const providers = {
  zhipu: { baseUrl: 'https://open.bigmodel.cn/api/paas/v4', defaultModel: 'glm-5.3-flash' },
  zai: { baseUrl: 'https://api.z.ai/api/paas/v4', defaultModel: 'glm-5.3-flash' },
  deepseek: { baseUrl: 'https://api.deepseek.com', defaultModel: 'deepseek-chat' },
  custom: { baseUrl: '', defaultModel: '' },
};

const REALMS = [
  '凡人','炼气初期','炼气中期','炼气后期','炼气大圆满',
  '筑基初期','筑基中期','筑基后期','结丹初期','结丹中期','结丹后期',
  '元婴真君','化神大能','炼虚合道','大乘渡劫','真仙飞升'
];

/* 完整天赋池（每次十连抽选3个） */
const ALL_TALENTS = [
  { id: 'ring_oldman', name: '戒指里的残魂', tier: 'red', tierName: '仙品', desc: '随身古戒藏有上古大能残魂，危急时刻可逆天改命', apply: g => { g.int += 3; g.items.push('古朴魂戒'); } },
  { id: 'chaos_body', name: '荒古圣体', tier: 'red', tierName: '仙品', desc: '体魄+5，根骨+3，同阶斗法无敌，但前期耗费灵石翻倍', apply: g => { g.body += 5; g.bone += 3; } },

let meta = loadMeta();
let game = loadGame();
let drawnTalents = [];
let pickedTalentIds = [];
let allocStats = { bone: 4, int: 4, body: 4, luck: 4, charm: 4 };
let busy = false;

function loadMeta() {
  try {
    const raw = localStorage.getItem(META_KEY);
    if (raw) return JSON.parse(raw);
  } catch {}
  return { count: 1, bonusPoints: 0 };
}
function saveMeta() { localStorage.setItem(META_KEY, JSON.stringify(meta)); }
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const g = JSON.parse(raw);
      if (g && typeof g.age === 'number') return g;
    }
  } catch {}
  return null;
}
function saveGame() { if (game) localStorage.setItem(SAVE_KEY, JSON.stringify(game)); }

function showToast(msg, warn = false) {
  const el = document.getElementById('toast');
  if (!msg) { el.hidden = true; return; }
  el.textContent = msg;
  el.className = warn ? 'toast warn' : 'toast';
  el.hidden = false;
  setTimeout(() => { el.hidden = true; }, 4500);
}

/* ==================== 轮回开局设置 ==================== */
function initSetupScreen() {
  document.getElementById('screen-setup').hidden = false;
  document.getElementById('screen-play').hidden = true;
  document.getElementById('ending-modal').hidden = true;
  document.getElementById('reincarnation-num').textContent = meta.count;
  const totalPts = 20 + (meta.bonusPoints || 0);
  allocStats = { bone: 4, int: 4, body: 4, luck: 4, charm: 4 };
  // 多出来的点数留在未分配池
  drawTenTalents();
  renderAllocList(totalPts);
}

function drawTenTalents() {
  drawnTalents = [...ALL_TALENTS].sort(() => Math.random() - 0.5).slice(0, 10);
  pickedTalentIds = [];
  renderDrawPool();
}

function renderDrawPool() {
  document.getElementById('picked-count').textContent = pickedTalentIds.length;
  const wrap = document.getElementById('draw-pool');
  wrap.innerHTML = '';
  drawnTalents.forEach(t => {
    const picked = pickedTalentIds.includes(t.id);
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = picked ? 'talent-item picked' : 'talent-item';
    const cls = t.tier === 'red' ? 't-red' : t.tier === 'gold' ? 't-gold' : t.tier === 'blue' ? 't-blue' : 't-gray';
    btn.innerHTML = `
      <span class="tier-tag ${cls}">${t.tierName}</span>
      <strong style="font-size:.82rem;color:#fff5de">${t.name}</strong>
      <small style="font-size:.71rem;color:var(--muted);line-height:1.3">${t.desc}</small>
    `;
    btn.onclick = () => {
      if (picked) pickedTalentIds = pickedTalentIds.filter(x => x !== t.id);
      else if (pickedTalentIds.length < 3) pickedTalentIds.push(t.id);
      else { showToast('每世最多携带 3 项先天命格！', true); return; }
      renderDrawPool();
    };
    wrap.appendChild(btn);
  });
}

function renderAllocList(totalPts) {
  const used = Object.values(allocStats).reduce((a, b) => a + b, 0);
  const left = totalPts - used;
  document.getElementById('pts-left').textContent = left;
  const names = [
    ['bone', '根骨（修炼速度/寿元）'],
    ['int', '悟性（神通/突破几率）'],
    ['body', '体魄（斗法/抗天劫）'],
    ['luck', '气运（奇遇/避祸概率）'],
    ['charm', '魅力（道侣/贵人缘分）']
  ];
  const wrap = document.getElementById('stat-alloc-list');
  wrap.innerHTML = '';
  names.forEach(([key, label]) => {
    const row = document.createElement('div');
    row.className = 'stat-row';
    row.innerHTML = `<span style="font-size:.82rem">${label}</span>`;
    const ctrl = document.createElement('div');
    ctrl.className = 'stat-ctrl';
    const bMinus = document.createElement('button');
    bMinus.type = 'button'; bMinus.textContent = '-';
    bMinus.disabled = allocStats[key] <= 1;
    bMinus.onclick = () => { allocStats[key] -= 1; renderAllocList(totalPts); };
    const val = document.createElement('strong');
    val.style.minWidth = '20px'; val.style.textAlign = 'center'; val.style.color = 'var(--gold)';
    val.textContent = allocStats[key];
    const bPlus = document.createElement('button');
    bPlus.type = 'button'; bPlus.textContent = '+';
    bPlus.disabled = left <= 0;
    bPlus.onclick = () => { allocStats[key] += 1; renderAllocList(totalPts); };
    ctrl.append(bMinus, val, bPlus);
    row.appendChild(ctrl);
    wrap.appendChild(row);
  });
}

/* ==================== 核心人生事件与抉择引擎 ==================== */
function pushLog(age, text, kind = 'normal', delta = '') {
  game.history.push({ age, text, kind, delta });
  if (game.history.length > 150) game.history.shift();
}

function calcPower() {
  return game.realm * 25 + game.body * 3 + game.int * 2 + game.items.length * 12 + game.arts.length * 18;
}

function stepOneYear() {
  if (!game || !game.alive || game.pendingChoice) return;
  game.age += 1;

  // 检查寿元
  if (game.age >= game.maxAge) {
    triggerEnding(false, `岁月至 ${game.age} 载，你大限已至，一生修为止步于【${REALMS[game.realm]}】，终究化作一抔黄土。`);
    return;
  }

  // 固定年龄里程碑事件
  if (game.age === 6) {
    triggerMilestone6();
    return;
  }
  if (game.age === 12 && game.realm === 0) {
    triggerMilestone12();
    return;
  }

  // 日常修为自然增长
  if (game.realm > 0) {
    const qiGain = Math.max(4, Math.floor((game.bone * 1.4 + game.int * 0.8) * (1 + Math.random() * 0.4)));
    game.qi = Math.min(100, game.qi + qiGain);
  }

  // 触发高沉浸人生随机事件或抉择
  const roll = Math.random();
  if (roll < 0.46) {
    triggerDilemmaEvent();
  } else {
    triggerNarrativeEvent();
  }
  saveGame();
  renderPlay();
}

  } else {

  }

/* 普通年份流转叙事 */
function triggerNarrativeEvent() {
  const events = [
    () => {
      const s = 6 + game.luck;
      game.stones += s;
      pushLog(game.age, `你在山门外接了护送商队的差事，一路平安，赚得 ${s} 枚灵石。`, 'normal', `灵石+${s}`);
    },
    () => {
      const q = 12 + game.int;
      game.qi = Math.min(100, game.qi + q);
      pushLog(game.age, `你在洞府静坐观雨，对天地灵气运转又多了一分体悟。`, 'normal', `修为+${q}%`);
    },
    () => {
      if (game.relations.length > 0) {
        const rel = game.relations[Math.floor(Math.random() * game.relations.length)];
        if (rel.type === '宿敌') {
          game.body += 1;
          pushLog(game.age, `宿敌【${rel.name}】派杀手夜袭你的洞府，被你反杀，实战磨砺令你体魄精进！`, 'major', '体魄+1');
        } else {
          const q = 18;
          game.qi = Math.min(100, game.qi + q);
          pushLog(game.age, `【${rel.name}】传信邀你赴茶会论道，一番交流令你受益匪浅。`, 'love', `修为+${q}%`);
        }
      } else {
        game.luck += 1;
        pushLog(game.age, `你在古道茶摊随手施舍了一名落魄老乞丐，对方临走前留下一句莫名谶语。`, 'good', '气运+1');
      }
    },
    () => {
      if (game.stones >= 12) {
        game.stones -= 12;
        game.qi = Math.min(100, game.qi + 22);
        pushLog(game.age, `你在万宝楼购入几瓶聚气丹闭关吞服，修为稳步提升。`, 'normal', '灵石-12 · 修为+22%');
      } else {
        game.stones += 8;
        pushLog(game.age, `你替丹房采药一载，赚了些许灵石补贴家用。`, 'normal', '灵石+8');
      }
    }
  ];
  events[Math.floor(Math.random() * events.length)]();
}

function resolveOption(opt) {
  const ok = opt.check();
  const res = ok ? opt.run() : opt.onFail();
  pushLog(game.age, res.text, res.kind, res.delta);
  game.pendingChoice = null;
  saveGame();
  renderPlay();
}

/* AI 自由输入自主破局 */
async function handleAiCustomChoice(userText) {
  if (!userText.trim() || !game.pendingChoice || busy) return;
  const cfg = getSavedModel();
  if (!cfg) {
    showToast('请先切到「天道模型」标签页连接大模型，即可解锁任意输入自主破局！', true);
    return;
  }
  busy = true;
  const btn = document.getElementById('btn-ai-choice');
  btn.disabled = true; btn.textContent = '天道推演中…';
  try {
    const sys = [
      '你是《修仙人生模拟器》的天道裁判。玩家当前遇到了一个命运事件，没有选预设选项，而是自己输入了破局行动。',
      '请结合玩家的年龄、境界、五维属性（根骨/悟性/体魄/气运/魅力）、天赋和法宝，客观推演此行动的结果（80~140字），既要有修仙小说爽感，也要遵循因果逻辑（属性太低强行装逼会吃亏甚至重伤）。',
      '输出严格JSON：{"story":"结果叙事","kind":"good或major或love或normal","stonesDelta":整数(-30到60),"qiDelta":整数(-20到45),"boneDelta":整数(-1到2),"intDelta":整数(-1到2),"bodyDelta":整数(-1到2),"luckDelta":整数(-1到2),"charmDelta":整数(-1到2),"ageDelta":整数(-10到5),"newItem":"获得新宝物名或空字符串","died":布尔值}'
    ].join('\n');
    const out = await callAI(sys, {
      player: { name: game.name, age: game.age, realm: REALMS[game.realm], bone: game.bone, int: game.int, body: game.body, luck: game.luck, charm: game.charm, talents: game.talents.map(t => t.name), items: game.items },
      event: { title: game.pendingChoice.title, desc: game.pendingChoice.desc },
      playerAction: userText
    });
    game.stones = Math.max(0, game.stones + (Number(out.stonesDelta) || 0));
    game.qi = Math.max(0, Math.min(100, game.qi + (Number(out.qiDelta) || 0)));
    game.bone = Math.max(1, game.bone + (Number(out.boneDelta) || 0));
    game.int = Math.max(1, game.int + (Number(out.intDelta) || 0));
    game.body = Math.max(1, game.body + (Number(out.bodyDelta) || 0));
    game.luck = Math.max(1, game.luck + (Number(out.luckDelta) || 0));
    game.charm = Math.max(1, game.charm + (Number(out.charmDelta) || 0));
    game.maxAge += (Number(out.ageDelta) || 0);
    let deltas = [];
    if (out.stonesDelta) deltas.push(`灵石${out.stonesDelta > 0 ? '+' : ''}${out.stonesDelta}`);
    if (out.qiDelta) deltas.push(`修为${out.qiDelta > 0 ? '+' : ''}${out.qiDelta}%`);
    if (out.newItem) { game.items.push(out.newItem); deltas.push(`得宝【${out.newItem}】`); }
    pushLog(game.age, out.story, out.kind || 'good', deltas.join(' · '));
    game.pendingChoice = null;
    document.getElementById('ai-choice-input').value = '';
    if (out.died) {
      triggerEnding(false, out.story);
      return;
    }
    saveGame();
  } catch (err) {
    showToast('天道推演失败：' + err.message, true);
  } finally {
    busy = false;
    btn.disabled = false; btn.textContent = '自主破局';
    renderPlay();
  }
}

/* 冲关渡劫 */
function attemptBreakthrough() {
  if (game.pendingChoice) return;
  if (game.qi < 100) {
    showToast(`当前修为 ${game.qi}%，需圆满（100%）方可冲关渡劫！`, true);
    return;
  }
  const nextRealm = game.realm + 1;
  if (nextRealm >= REALMS.length) {
    triggerEnding(true, `历经千劫万难，你终于白日飞升，位列仙班！`);
    return;
  }
  const isMajor = [5, 8, 11, 12, 14, 15].includes(nextRealm);
  const rate = Math.min(96, 48 + game.int * 2 + game.bone * 2 + game.luck + (game.talents.some(t => t.id === 'alchemy_sage') ? 12 : 0) - (isMajor ? 18 : 0));
  game.age += 1;
  if (Math.random() * 100 < rate) {
    game.realm = nextRealm;
    game.qi = 0;
    if (isMajor) game.maxAge += 100;
    pushLog(game.age, `九霄雷劫轰鸣而下，你祭出全部底牌硬抗天威，成功突破至【${REALMS[game.realm]}】！`, 'good', `晋升${REALMS[game.realm]}${isMajor ? ' · 寿元+100年' : ''}`);
    if (game.realm === REALMS.length - 1) {
      triggerEnding(true, `你渡过大乘天劫，仙门洞开，接引神光笼罩全身，终成无上真仙！`);
      return;
    }
  } else {
    game.qi = 60;
    game.maxAge -= 8;
    pushLog(game.age, `天劫威力超乎想象，你肉身焦黑险些形神俱灭，虽保住性命却折损八年寿元！`, 'major', '破境失败 · 寿元-8年');
  }
  saveGame(); renderPlay();
}

function addOrUpdateRel(name, role, type, favor, power) {
  const existing = game.relations.find(r => r.name === name);
  if (existing) {
    existing.type = type; existing.favor = favor;
  } else {
    game.relations.push({ name, role, type, favor, power });
  }
}

/* 模型连接与导入导出 */
function normalizeUrl(raw) {
  if (typeof raw !== 'string') return '';
  const t = raw.trim().replace(/\/+$/, '');
  if (!t) return '';
  try { const u = new URL(t); return u.protocol === 'https:' ? u.origin + u.pathname.replace(/\/+$/, '') : ''; } catch { return ''; }
}
function resolveTargetBase(baseUrl, proxy) {
  const b = normalizeUrl(baseUrl);
  if (!b) return '';
  const p = normalizeUrl(proxy);
  if (!p) return b;
  try { return p + new URL(b).pathname.replace(/\/+$/, ''); } catch { return p + '/api/paas/v4'; }
}
function getSavedModel() {
  try {
    const raw = localStorage.getItem(MODEL_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (p && p.modelName && p.key && p.baseUrl) return p;
  } catch {}
  return null;
}
async function callAI(systemPrompt, userPayload) {
  const cfg = getSavedModel();
  if (!cfg) return null;
  const targetBase = resolveTargetBase(cfg.baseUrl, cfg.proxy);
  const origin = new URL(targetBase).origin;
  const isZai = origin === 'https://api.z.ai';
  const isDeepseek = origin === 'https://api.deepseek.com';
  const res = await fetch(targetBase + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
    body: JSON.stringify({
      model: cfg.modelName,
      messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: JSON.stringify(userPayload) }],
      max_tokens: 900,
      response_format: { type: 'json_object' },
      ...(isZai ? { reasoning_effort: 'low' } : isDeepseek ? { thinking: { type: 'disabled' } } : {})
    }),
    signal: AbortSignal.timeout(25000),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const raw = (data.choices?.[0]?.message?.content || '').replace(/^```json\s*/i, '').replace(/```\s*$/, '').trim();
  return JSON.parse(raw);
}

const savedProxy = localStorage.getItem(PROXY_CACHE_KEY) || '';
if (savedProxy) document.getElementById('model-proxy').value = savedProxy;
const savedCfg = getSavedModel();
if (savedCfg) {
  document.getElementById('model-provider').value = savedCfg.provider || 'zhipu';
  document.getElementById('model-name').value = savedCfg.modelName;
  document.getElementById('model-base-url').value = savedCfg.baseUrl;
  if (savedCfg.proxy) document.getElementById('model-proxy').value = savedCfg.proxy;
}
document.getElementById('model-provider').addEventListener('change', e => {
  const p = providers[e.target.value];
  if (!p) return;
  document.getElementById('model-name').value = p.defaultModel;
  document.getElementById('model-base-url').value = p.baseUrl;
});
document.getElementById('model-form').addEventListener('submit', async e => {
  e.preventDefault();
  const provider = document.getElementById('model-provider').value;
  const modelName = document.getElementById('model-name').value.trim();
  const key = document.getElementById('model-key').value.trim();
  const baseUrl = document.getElementById('model-base-url').value.trim();
  const proxy = document.getElementById('model-proxy').value.trim();
  if (!modelName || !key || !baseUrl) return;
  if (proxy) localStorage.setItem(PROXY_CACHE_KEY, proxy);
  const btn = document.getElementById('btn-connect'); btn.disabled = true; btn.textContent = '验证中…';
  try {
    const targetBase = resolveTargetBase(baseUrl, proxy);
    const res = await fetch(targetBase + '/chat/completions', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: modelName, messages: [{ role: 'user', content: '回复OK' }], max_tokens: 64 }),
      signal: AbortSignal.timeout(20000),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    localStorage.setItem(MODEL_KEY, JSON.stringify({ provider, modelName, key, baseUrl: normalizeUrl(baseUrl), proxy: normalizeUrl(proxy) }));
    document.getElementById('model-key').value = '';
    showToast(`天道神识已连通 ${modelName}！`);
  } catch (err) {
    showToast(`连接失败（${err.message}），请核对中转网址与 Key。`, true);
  } finally { btn.disabled = false; btn.textContent = '验证并连接'; renderPlay(); }
});
document.getElementById('btn-disconnect').addEventListener('click', () => {
  localStorage.removeItem(MODEL_KEY);
  showToast('已断开模型连接。'); renderPlay();
});
document.getElementById('btn-export').addEventListener('click', () => {
  const code = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(game))));
  window.prompt('复制下方存档码保存：', code);
});
document.getElementById('btn-import').addEventListener('click', () => {
  const code = window.prompt('粘贴存档码：');
  if (!code) return;
  try {
    const bin = atob(code.trim());
    const obj = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (obj && typeof obj.age === 'number') { game = obj; saveGame(); startPlayScreen(); showToast('存档导入成功！'); }
  } catch { showToast('存档码无效。', true); }
});

/* 启动入口 */
if (game && game.alive) {
  startPlayScreen();
} else {
  initSetupScreen();
}
</script>
</body>
</html>
