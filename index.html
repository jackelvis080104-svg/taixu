<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#161320">
  <title>樱华物语 · AI 心跳修罗场</title>
  <style>
:root{
  color-scheme:dark;
  --bg:#120f1c;
  --panel:rgba(22, 18, 34, 0.88);
  --card:rgba(32, 26, 48, 0.92);
  --pink:#ff7597;
  --pink-soft:rgba(255, 117, 151, 0.18);
  --gold:#ffd166;
  --blue:#70d6ff;
  --purple:#c77dff;
  --text:#fff7fa;
  --muted:#b8adc9;
  --line:rgba(255, 180, 205, 0.24);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:#0c0a12;
  color:var(--text);
  font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14.5px;
  line-height:1.6;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
button,input,select{font:inherit}
button{cursor:pointer;border:none}
button:disabled{opacity:.45;cursor:default}
[hidden]{display:none!important}

.game-shell{
  width:100%;
  max-width:560px;
  min-height:100vh;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 0 50px rgba(0,0,0,.85);
  border-left:1px solid var(--line);
  border-right:1px solid var(--line);
}

/* 动态场景背景层 */
.scene-bg{
  position:absolute;
  inset:0;
  z-index:0;
  transition:background 0.8s ease;
}
.bg-classroom{
  background:
    radial-gradient(circle at 75% 25%, rgba(255, 183, 107, 0.45) 0%, transparent 45%),
    linear-gradient(180deg, #3b2645 0%, #7a3e54 45%, #24192e 100%);
}
.bg-rooftop{
  background:
    radial-gradient(circle at 30% 20%, rgba(112, 214, 255, 0.38) 0%, transparent 50%),
    linear-gradient(180deg, #1b3b6f 0%, #4ea8de 52%, #1c2541 100%);
}
.bg-cafe{
  background:
    radial-gradient(circle at 50% 30%, rgba(255, 209, 102, 0.25) 0%, transparent 55%),
    linear-gradient(180deg, #2b1d1a 0%, #4a2c24 55%, #17100e 100%);
}
.bg-shuraba{
  background:
    radial-gradient(circle at 50% 20%, rgba(255, 56, 96, 0.42) 0%, transparent 55%),
    linear-gradient(180deg, #3a0ca3 0%, #7209b7 45%, #1a0b24 100%);
}

/* 飘落樱花粒子装饰 */
.petals{
  position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:
    radial-gradient(circle, rgba(255,192,203,.55) 2px, transparent 3px),
    radial-gradient(circle, rgba(255,220,230,.4) 1.5px, transparent 2.5px);
  background-size: 90px 90px, 130px 130px;
  background-position: 0 0, 40px 60px;
  animation: drift 18s linear infinite;
}
@keyframes drift{
  from{transform:translateY(-20px)}
  to{transform:translateY(70px)}
}

/* 顶部 Galgame 状态栏 */
.hud-top{
  position:relative;
  z-index:10;
  background:linear-gradient(180deg, rgba(16,13,26,.92) 0%, rgba(16,13,26,.72) 100%);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:.55rem .8rem;
  display:flex;
  flex-direction:column;
  gap:.4rem;
}
.hud-row{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.loc-pill{
  font-size:.76rem;font-weight:700;padding:.14rem .55rem;border-radius:99px;
  background:var(--pink-soft);border:1px solid var(--pink);color:#ffd6e0;
}
.shuraba-meter{
  display:flex;align-items:center;gap:.35rem;font-size:.74rem;color:var(--gold);
}
.meter-bar{width:64px;height:6px;background:rgba(255,255,255,.14);border-radius:4px;overflow:hidden}
.meter-fill{height:100%;background:linear-gradient(90deg,#ffd166,#ff4d6d);transition:width .3s ease}

.hud-btns{display:flex;gap:.35rem}
.icon-btn{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);
  color:var(--text);font-size:.74rem;padding:.2rem .5rem;border-radius:6px;
}
.icon-btn:hover{border-color:var(--pink);background:var(--pink-soft)}

/* 女主快捷好感条 */
.heroine-strip{
  display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem;
}
.h-chip{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:7px;padding:.22rem .42rem;font-size:.72rem;
  display:flex;justify-content:space-between;align-items:center;
  cursor:pointer;transition:all .15s ease;
}
.h-chip.active{border-color:var(--pink);background:rgba(255,117,151,.2);box-shadow:0 0 10px rgba(255,117,151,.25)}
.h-chip strong{color:#fff}
.h-chip span{color:var(--pink);font-weight:700}

/* 立绘舞台区 */
.sprite-stage{
  position:relative;
  z-index:2;
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  min-height:260px;
  padding-top:.5rem;
  overflow:hidden;
}
.sprite-wrap{
  width:255px;
  height:285px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  transition:transform .28s cubic-bezier(.22,1,.36,1), filter .25s ease;
  filter:drop-shadow(0 10px 24px rgba(0,0,0,.65));
}
.sprite-wrap.bounce{animation:spriteBounce .38s ease}
@keyframes spriteBounce{
  0%{transform:translateY(0)}
  40%{transform:translateY(-10px)}
  100%{transform:translateY(0)}
}

/* 浮动心声气泡（Galgame 灵魂读心功能） */
.mind-bubble{
  position:absolute;
  top:12px;
  right:14px;
  left:14px;
  z-index:5;
  background:rgba(25, 18, 42, 0.86);
  backdrop-filter:blur(8px);
  border:1px dashed var(--purple);
  border-radius:12px;
  padding:.48rem .72rem;
  font-size:.79rem;
  color:#e8c7ff;
  box-shadow:0 6px 20px rgba(0,0,0,.45);
  animation:fadeIn .3s ease;
}
.mind-tag{
  display:inline-block;
  font-size:.68rem;
  font-weight:700;
  background:rgba(199,125,255,.22);
  color:#e0aaff;
  padding:.02rem .35rem;
  border-radius:4px;
  margin-right:.35rem;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* 底部 Galgame 经典对话框与操作区 */
.vn-dock{
  position:relative;
  z-index:10;
  background:linear-gradient(180deg, rgba(20, 16, 32, 0.93) 0%, rgba(14, 11, 23, 0.98) 100%);
  backdrop-filter:blur(12px);
  border-top:1.5px solid var(--pink);
  border-radius:18px 18px 0 0;
  padding:.75rem .85rem 1.1rem;
  display:flex;
  flex-direction:column;
  gap:.6rem;
  box-shadow:0 -10px 30px rgba(0,0,0,.65);
}

.speaker-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.name-plate{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  background:linear-gradient(90deg, var(--pink), #b5179e);
  color:#fff;
  font-weight:700;
  font-size:.9rem;
  padding:.18rem .75rem;
  border-radius:6px 14px 6px 2px;
  box-shadow:0 3px 10px rgba(255,117,151,.35);
}
.expr-badge{
  font-size:.73rem;
  color:var(--muted);
  background:rgba(255,255,255,.07);
  padding:.12rem .45rem;
  border-radius:99px;
}

.dialogue-box{
  min-height:76px;
  max-height:130px;
  overflow-y:auto;
  font-size:.94rem;
  line-height:1.68;
  color:#fff8fb;
  letter-spacing:.02em;
  padding:.1rem .15rem;
}
.narrator-text{color:#d8cce8;font-style:italic}

/* 快捷选项 + 自由输入 */
.choice-stack{display:grid;gap:.42rem}
.vn-choice{
  width:100%;
  text-align:left;
  padding:.48rem .72rem;
  border-radius:9px;
  background:rgba(255, 255, 255, 0.06);
  border:1px solid rgba(255, 180, 205, 0.28);
  color:#fff;
  font-size:.84rem;
  transition:all .14s ease;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:.4rem;
}
.vn-choice:hover:not(:disabled){
  background:rgba(255, 117, 151, 0.22);
  border-color:var(--pink);
  transform:translateX(3px);
}
.vn-choice small{color:var(--gold);font-size:.72rem;white-space:nowrap}

.free-input-row{
  display:flex;
  gap:.42rem;
  margin-top:.1rem;
}
.vn-inp{
  flex:1;
  min-height:40px;
  padding:.38rem .68rem;
  border-radius:9px;
  background:rgba(10, 8, 18, 0.85);
  border:1px solid rgba(255, 180, 205, 0.35);
  color:#fff;
  font-size:.85rem;
}
.vn-inp:focus{outline:none;border-color:var(--pink)}
.btn-send{
  min-height:40px;
  padding:0 .85rem;
  border-radius:9px;
  background:linear-gradient(135deg, #ff7597 0%, #c9184a 100%);
  color:#fff;
  font-weight:700;
  font-size:.84rem;
  white-space:nowrap;
}

/* 弹窗层（档案、历史记录、天道模型设置） */
.modal-mask{
  position:fixed;inset:0;z-index:50;
  background:rgba(8, 6, 15, 0.86);
  backdrop-filter:blur(6px);
  display:flex;justify-content:center;align-items:center;padding:.85rem;
}
.modal-card{
  width:100%;max-width:480px;max-height:86vh;overflow-y:auto;
  background:#1b1629;border:1px solid var(--pink);border-radius:14px;
  padding:1rem;box-shadow:0 15px 45px rgba(0,0,0,.85);
  display:flex;flex-direction:column;gap:.7rem;
}
.modal-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:.45rem}
.modal-head h3{margin:0;color:var(--pink);font-size:1.02rem}
.inp{width:100%;min-height:38px;padding:.35rem .6rem;border-radius:7px;background:#110e1c;border:1px solid #3c3254;color:#fff}
.btn{min-height:38px;padding:.35rem .7rem;border-radius:7px;background:#2c2440;border:1px solid #4e4170;color:#fff;font-weight:600;font-size:.83rem}
.btn.primary{background:linear-gradient(135deg,#ff7597,#b5179e);border:none}
.btn.danger{background:#5e2129;border-color:#a43846}

.toast{
  position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:60;
  background:#281d3d;border:1px solid var(--pink);color:#fff;
  padding:.4rem .8rem;border-radius:99px;font-size:.78rem;
  box-shadow:0 6px 20px rgba(0,0,0,.6);white-space:nowrap;
}
  </style>
</head>
<body>
<div class="game-shell">
  <div id="scene-bg" class="scene-bg bg-classroom"></div>
  <div class="petals"></div>
  <div id="toast" class="toast" hidden></div>

  <!-- 顶部状态与三女主好感切换 -->
  <header class="hud-top">
    <div class="hud-row">
      <div style="display:flex;align-items:center;gap:.45rem">
        <span class="loc-pill" id="hud-loc">放学后 · 教学楼天台</span>
        <span style="font-size:.74rem;color:var(--muted)" id="hud-day">第 1 天 · 黄昏</span>
      </div>
      <div class="shuraba-meter" title="修罗场警戒值过高时，其他女主会突然闯入现场！">
        <span>修罗场</span>
        <div class="meter-bar"><div class="meter-fill" id="shuraba-bar" style="width:15%"></div></div>
        <strong id="shuraba-val">15%</strong>
      </div>
    </div>

    <div class="heroine-strip" id="heroine-strip"></div>

    <div class="hud-row" style="margin-top:.1rem">
      <span style="font-size:.72rem;color:var(--muted)" id="ai-status-text">推演引擎：本地剧本（点右侧连 AI 解锁无限嘴遁）</span>
      <div class="hud-btns">
        <button type="button" class="icon-btn" id="btn-toggle-mind">心声:开</button>
        <button type="button" class="icon-btn" id="btn-open-log">回忆录</button>
        <button type="button" class="icon-btn" id="btn-open-dossier">角色档案</button>
        <button type="button" class="icon-btn" style="border-color:var(--gold);color:var(--gold)" id="btn-open-ai">连接 AI</button>
      </div>
    </div>
  </header>

  <!-- 中央立绘舞台 -->
  <main class="sprite-stage">
    <div id="mind-bubble" class="mind-bubble" hidden>
      <span class="mind-tag">真实心声</span><span id="mind-text">……</span>
    </div>
    <div id="sprite-wrap" class="sprite-wrap"></div>
  </main>

  <!-- 底部 Galgame 对话框 -->
  <section class="vn-dock">
    <div class="speaker-row">
      <div class="name-plate" id="speaker-name">林清浅</div>
      <span class="expr-badge" id="speaker-expr">平静 · 好感 20</span>
    </div>

    <div class="dialogue-box" id="dialogue-text"></div>

    <div class="choice-stack" id="choice-stack"></div>

    <form id="free-form" class="free-input-row">
      <input id="free-input" class="vn-inp" maxlength="140" placeholder="亲自输入你的台词或动作（如：伸手替她拂去发梢的樱花）">
      <button type="submit" class="btn-send" id="btn-send">互动</button>
    </form>
  </section>
</div>

<!-- 弹窗 1：连接大模型 -->
<div id="modal-ai" class="modal-mask" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>天道神识 · 连接 Galgame 剧本引擎</h3>
      <button type="button" class="icon-btn" data-close="modal-ai">关闭</button>
    </div>
    <p style="font-size:.78rem;color:var(--muted);margin:0">连接后，三位女主将拥有独立记忆与信息差。你可以输入任何离谱情话、借口或修罗场端水操作，AI 会实时生成台词、隐藏心声与好感波动。</p>
    <form id="model-form" style="display:grid;gap:.45rem">
      <select id="model-provider" class="inp">
        <option value="zhipu">智谱国内 (open.bigmodel.cn)</option>
        <option value="zai">Z.ai 海外 (api.z.ai)</option>
        <option value="deepseek">DeepSeek (api.deepseek.com)</option>
        <option value="custom">自定义 OpenAI 兼容接口</option>
      </select>
      <input id="model-name" class="inp" value="glm-5.3-flash" placeholder="模型名称，如 glm-5.3-flash" required>
      <input id="model-key" type="password" class="inp" placeholder="粘贴 API Key" required>
      <input id="model-base-url" type="url" class="inp" value="https://open.bigmodel.cn/api/paas/v4" required>
      <input id="model-proxy" type="url" class="inp" placeholder="跨域中转网址（连智谱必填，直连留空）">
      <div style="display:flex;gap:.45rem">
        <button type="submit" class="btn primary" id="btn-connect" style="flex:1">验证并连接</button>
        <button type="button" class="btn danger" id="btn-disconnect" hidden>断开</button>
      </div>
    </form>
  </div>
</div>

<!-- 弹窗 2：角色档案与弱点情报 -->
<div id="modal-dossier" class="modal-mask" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>樱华学园 · 女主秘密档案</h3>
      <button type="button" class="icon-btn" data-close="modal-dossier">关闭</button>
    </div>
    <div id="dossier-list" style="display:grid;gap:.55rem"></div>
    <button type="button" class="btn danger" id="btn-reset-save">重置本局存档（重新开局）</button>
  </div>
</div>

<!-- 弹窗 3：对话回忆录 -->
<div id="modal-log" class="modal-mask" hidden>
  <div class="modal-card">
    <div class="modal-head">
      <h3>剧情回忆录（Backlog）</h3>
      <button type="button" class="icon-btn" data-close="modal-log">关闭</button>
    </div>
    <div id="log-list" style="display:grid;gap:.45rem;font-size:.82rem"></div>
  </div>
</div>

<script type="module">
const SAVE_KEY = 'sakura_galgame_v1';
const MODEL_KEY = 'taixu_wendaolu_model_v1';
const PROXY_CACHE_KEY = 'taixu_wendaolu_proxy_v1';

const providers = {
  zhipu: { baseUrl: 'https://open.bigmodel.cn/api/paas/v4', defaultModel: 'glm-5.3-flash' },
  zai: { baseUrl: 'https://api.z.ai/api/paas/v4', defaultModel: 'glm-5.3-flash' },
  deepseek: { baseUrl: 'https://api.deepseek.com', defaultModel: 'deepseek-chat' },
  custom: { baseUrl: '', defaultModel: '' },
};

const HEROINES = {
  qingqian: {
    id: 'qingqian',
    name: '林清浅',
    title: '高岭之花 · 学生会长',
    hair: '#2b2d42',
    eye: '#4ea8de',
    ribbon: '#ffd166',
    uniform: '#1d2d44',
    personality: '表面清冷严厉、极其注重校规与体面，实则容易害羞、吃软不吃硬，一旦被直球夸奖就会耳根发红。',
    secret: '其实每天都会特意在天台多留十分钟，只为了偶遇你；书包里藏着半织好的围巾。',
  },
  xiaoman: {
    id: 'xiaoman',
    name: '苏小满',
    title: '元气毒舌 · 青梅竹马',
    hair: '#d97742',
    eye: '#52b788',
    ribbon: '#ff7597',
    uniform: '#2b293d',
    personality: '嘴硬心软的典型傲娇青梅，最爱吐槽你“笨蛋”，对你的行踪了如指掌，占有欲极强。',
    secret: '手机相册里存了上百张偷拍你睡觉和打球的丑照，绝不允许其他女生靠近你三米以内。',
  },
  yeli: {
    id: 'yeli',
    name: '夜璃',
    title: '魅惑腹黑 · 神秘转校生',
    hair: '#5a189a',
    eye: '#ff4d6d',
    ribbon: '#c77dff',
    uniform: '#24172e',
    personality: '慵懒优雅、喜欢逗弄纯情男生的文学少女，说话总带一丝暧昧试探，最喜欢看修罗场热闹。',
    secret: '能敏锐察觉你在撒谎，比起听乖乖牌情话，更欣赏你大胆反客为主、反撩她的样子。',
  }
};

const SCENES = {
  rooftop: { name: '教学楼天台', cls: 'bg-rooftop' },
  classroom: { name: '黄昏旧校舍教室', cls: 'bg-classroom' },
  cafe: { name: '街角雨夜咖啡馆', cls: 'bg-cafe' },
  shuraba: { name: '修罗场暴风眼', cls: 'bg-shuraba' }
};

function createInitialState() {
  return {
    day: 1,
    timeSlot: '放学后',
    scene: 'rooftop',
    activeId: 'qingqian',
    expr: 'normal',
    shuraba: 15,
    showMind: true,
    favor: { qingqian: 25, xiaoman: 35, yeli: 20 },
    speaker: '林清浅',
    text: '夕阳把天台的铁丝网染成了橘红色。学生会长林清浅正抱着一叠文件站在风口，见你推门上来，她微微蹙眉合上文件夹：“……这里风大，不是让你在楼下等我吗？怎么自己跑上来了。”',
    mind: '其实已经在这里等了他二十分钟了……千万不能让他看出来我特意整理过头发！',
    choices: [
      { label: '“怕会长一个人吹风着凉，所以提前上来陪你。”', hint: '直球暴击' },
      { label: '“我是来帮会长分担文件工作的。”', hint: '稳重体贴' },
      { label: '“路过而已，没想到会长也在偷懒。”', hint: '反差调侃' }
    ],
    history: [
      { speaker: '林清浅', text: '这里风大，不是让你在楼下等我吗？怎么自己跑上来了。', mind: '其实已经等了他二十分钟了……' }
    ]
  };
}

let state = loadState();
let busy = false;
let typeTimer = null;

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && s.favor) return s;
    }
  } catch {}
  return createInitialState();
}
function saveState() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.hidden = true; }, 3200);
}

/* ==================== 动态二次元 SVG 立绘生成器 ==================== */
function renderCharacterSVG(heroineId, expr = 'normal') {

function typeDialogue(text) {
  const el = document.getElementById('dialogue-text');
  clearInterval(typeTimer);
  el.textContent = '';
  let i = 0;
  typeTimer = setInterval(() => {
    el.textContent += text[i] || '';
    i++;
    if (i >= text.length) clearInterval(typeTimer);
  }, 18);
}

async function submitPlayerAction(playerInput) {
  if (!playerInput || !playerInput.trim() || busy) return;
  const actionText = playerInput.trim();
  document.getElementById('free-input').value = '';
  state.history.push({ speaker: '我（主角）', text: actionText });

  const cfg = getSavedModel();
  if (!cfg) {
    runLocalFallback(actionText);
    return;
  }

  busy = true;
  renderGame(false);

  try {
    const h = HEROINES[state.activeId];
    const others = Object.values(HEROINES).filter(x => x.id !== h.id).map(x => `${x.name}(好感${state.favor[x.id]})`).join('、');
    const willShuraba = state.shuraba >= 70 && Math.random() < 0.55;

    const sys = [
      '你是日式校园恋爱 Galgame《樱华物语》的实时剧本导演。',
      `当前出场女主：【${h.name}】（${h.title}）。性格：${h.personality} 隐藏秘密：${h.secret}`,
      `当前好感度：${state.favor[h.id]}/100。其他女主状态：${others}。当前修罗场警戒值：${state.shuraba}%。`,
      willShuraba
        ? '【突发修罗场指令】：由于修罗场警戒值过高，请安排另一位女主突然推门闯入当前场景当场对质！把 scene 设为 "shuraba"，并让对话充满修罗场张力！'
        : '请根据玩家的台词或动作，以轻小说/Galgame 的细腻口吻写出她的反应、动作描写与台词（70~130字），同时写出她内心真实的娇羞/傲娇/腹黑心声（25~50字）。',
      '严格输出 JSON，格式如下：',
      '{"speaker":"说话人名字","text":"动作描写与台词","mind":"女主内心真实想法","expr":"normal或blush或happy或angry或smug或shocked或sad","favorDelta":整数(-10到15),"shurabaDelta":整数(-5到20),"scene":"rooftop或classroom或cafe或shuraba","choices":[{"label":"后续选项1","hint":"标签"},{"label":"后续选项2","hint":"标签"},{"label":"后续选项3","hint":"标签"}]}'
    ].join('\n');

    const recent = state.history.slice(-6).map(x => `${x.speaker}: ${x.text}`).join('\n');
    const out = await callAI(sys, {
      day: state.day,
      scene: state.scene,
      recentDialogue: recent,
      playerAction: actionText
    });

    const fDelta = Math.max(-15, Math.min(20, Number(out.favorDelta) || 3));
    const sDelta = Math.max(-10, Math.min(25, Number(out.shurabaDelta) || 5));
    state.favor[state.activeId] = Math.max(0, Math.min(100, (state.favor[state.activeId] || 20) + fDelta));
    state.shuraba = Math.max(0, Math.min(100, state.shuraba + sDelta));
    if (willShuraba) state.shuraba = 25;

    state.speaker = out.speaker || h.name;
    state.text = out.text || '她微微一怔，一时没有说话。';
    state.mind = out.mind || '……这家伙在说什么呢。';
    state.expr = ['normal','blush','happy','angry','smug','shocked','sad'].includes(out.expr) ? out.expr : 'blush';
    if (out.scene && SCENES[out.scene]) state.scene = out.scene;
    if (Array.isArray(out.choices) && out.choices.length) {
      state.choices = out.choices.slice(0, 3);
    }
    if (state.history.length % 4 === 0) state.day += 1;
    state.history.push({ speaker: state.speaker, text: state.text, mind: state.mind });
    if (state.history.length > 60) state.history.shift();
    showToast(`${h.name} 好感度 ${fDelta >= 0 ? '+' : ''}${fDelta}`);
    saveState();
  } catch (err) {
    showToast('AI 响应异常，已切为本地演出：' + err.message);
    runLocalFallback(actionText);
  } finally {
    busy = false;
    renderGame(true);
  }
}

function normalizeUrl(raw) {
  if (typeof raw !== 'string') return '';
  const t = raw.trim().replace(/\/+$/, '');
  if (!t) return '';
  try { const u = new URL(t); return u.protocol === 'https:' ? u.origin + u.pathname.replace(/\/+$/, '') : ''; } catch { return ''; }
}
function resolveTargetBase(baseUrl, proxy) {
  const b = normalizeUrl(baseUrl);
  if (!b) return '';
  const p = normalizeUrl(proxy);
  if (!p) return b;
  try { return p + new URL(b).pathname.replace(/\/+$/, ''); } catch { return p + '/api/paas/v4'; }
}
function getSavedModel() {
  try {
    const raw = localStorage.getItem(MODEL_KEY);
    if (!raw) return null;
    const p = JSON.parse(raw);
    if (p && p.modelName && p.key && p.baseUrl) return p;
  } catch {}
  return null;
}
function isGlm53(modelName) { return /^glm-5\.3(?:$|-)/i.test(modelName); }

async function requestModelJson(cfg, messages, { timeoutMs = 60000, maxTokens } = {}) {
  const targetBase = resolveTargetBase(cfg.baseUrl, cfg.proxy);
  const origin = new URL(normalizeUrl(cfg.baseUrl)).origin;
  const glm53 = isGlm53(cfg.modelName);
  const outputBudget = maxTokens ?? (glm53 ? 12000 : 2048);
  const lowEffort = origin === 'https://api.z.ai' || (origin === 'https://open.bigmodel.cn' && glm53);
  const res = await fetch(targetBase + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + cfg.key },
    body: JSON.stringify({
      model: cfg.modelName, messages, max_tokens: outputBudget,
      response_format: { type: 'json_object' },
      ...(lowEffort ? { reasoning_effort: 'low' } : origin === 'https://api.deepseek.com' ? { thinking: { type: 'disabled' } } : {}),
    }),
    signal: AbortSignal.timeout(timeoutMs),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const raw = (data?.choices?.[0]?.message?.content || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  return JSON.parse(raw);
}
async function callAI(systemPrompt, userPayload) {
  const cfg = getSavedModel();
  if (!cfg) throw new Error('模型未连接');
  return requestModelJson(cfg, [{ role: 'system', content: systemPrompt }, { role: 'user', content: JSON.stringify(userPayload) }]);
}

  const modelName = document.getElementById('model-name').value.trim();
  const key = document.getElementById('model-key').value.trim();
  const baseUrl = document.getElementById('model-base-url').value.trim();
  const proxy = document.getElementById('model-proxy').value.trim();
  if (!modelName || !key || !baseUrl) return;
  const btn = document.getElementById('btn-connect'); btn.disabled = true; btn.textContent = '验证中…';
  try {
    const cfg = { provider, modelName, key, baseUrl: normalizeUrl(baseUrl), proxy: normalizeUrl(proxy) };
    const result = await requestModelJson(cfg, [
      { role: 'system', content: '仅输出 JSON 对象 {"ok": true}。' },
      { role: 'user', content: '测试' },
    ], { timeoutMs: 30000, maxTokens: isGlm53(cfg.modelName) ? 2048 : 512 });
    if (result.ok !== true) throw new Error('返回格式异常');
    if (cfg.proxy) localStorage.setItem(PROXY_CACHE_KEY, cfg.proxy);
    localStorage.setItem(MODEL_KEY, JSON.stringify(cfg));
    document.getElementById('model-key').value = '';
    document.getElementById('btn-disconnect').hidden = false;
    document.getElementById('modal-ai').hidden = true;
    showToast(`已连通 ${modelName}，开始你的心动攻略吧！`);
  } catch (err) {
    showToast(`验证失败：${err.message}`);
  } finally { btn.disabled = false; btn.textContent = '验证并连接'; renderGame(false); }
});
document.getElementById('btn-disconnect').addEventListener('click', () => {
  localStorage.removeItem(MODEL_KEY);
  document.getElementById('btn-disconnect').hidden = true;
  showToast('已断开 AI 连接。');
  renderGame(false);
});

renderGame(true);
</script>
</body>
</html>
